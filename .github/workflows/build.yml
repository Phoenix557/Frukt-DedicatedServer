name: Build

# Every push to main rebuilds ghcr.io/phoenix557/frukt-server:latest.
# Pushing a tag like v1.2.1 also makes a GitHub release with FruktServer (Linux) and FruktServer.exe (Windows);
# servers with AUTO_UPDATE=1 download it on their next start. Bump <Version> in FruktServer.csproj to match.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/phoenix557/frukt-server

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish FruktServer for the image
        run: |
          version=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="-p:Version=${GITHUB_REF_NAME#v}"; fi
          dotnet publish FruktServer.csproj -c Release -r linux-x64 --self-contained $version \
            -p:PublishSingleFile=true -p:PublishTrimmed=true -p:DebugType=none -o docker/bin --nologo

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          tags="$IMAGE:latest,$IMAGE:sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags="$tags,$IMAGE:${GITHUB_REF_NAME#v}"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish standalone servers
        run: |
          for rid in linux-x64 win-x64; do
            dotnet publish FruktServer.csproj -c Release -r $rid --self-contained -p:Version=${GITHUB_REF_NAME#v} \
              -p:PublishSingleFile=true -p:PublishTrimmed=true -p:DebugType=none -o out/$rid --nologo
          done
          mkdir dist
          cp out/linux-x64/FruktServer dist/FruktServer
          cp out/win-x64/FruktServer.exe dist/FruktServer.exe

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/FruktServer dist/FruktServer.exe egg-frukt-dedicated-server.json \
            --title "FruktServer $GITHUB_REF_NAME" --generate-notes
